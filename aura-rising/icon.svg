<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="58%" r="70%">
      <stop offset="0" stop-color="#3b1f9e"/>
      <stop offset="0.55" stop-color="#170c46"/>
      <stop offset="1" stop-color="#07041a"/>
    </radialGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2fd0ff"/>
      <stop offset="0.5" stop-color="#8a6bff"/>
      <stop offset="1" stop-color="#f1e9ff"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9f3ff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- speed lines -->
  <g stroke="#ffffff" stroke-opacity="0.13" stroke-width="6" stroke-linecap="round">
    <line x1="256" y1="300" x2="40" y2="120"/>
    <line x1="256" y1="300" x2="472" y2="110"/>
    <line x1="256" y1="300" x2="20" y2="320"/>
    <line x1="256" y1="300" x2="492" y2="340"/>
    <line x1="256" y1="300" x2="110" y2="20"/>
    <line x1="256" y1="300" x2="400" y2="16"/>
  </g>
  <!-- aura flame -->
  <path filter="url(#glow)" fill="url(#flame)" d="M256 452c-86 0-142-58-142-132 0-54 30-92 58-122 4 34 18 56 40 70-6-62 18-128 74-188 2 58 30 96 62 128 10-26 10-50 4-76 44 34 88 100 88 176 0 84-60 144-184 144z"/>
  <path fill="url(#core)" d="M256 420c-46 0-80-32-80-76 0-34 20-58 40-76 2 24 12 38 28 46-2-40 14-78 44-112 4 40 20 62 40 82 6-14 6-30 4-44 22 22 40 56 40 98 0 50-36 82-116 82z" opacity="0.92"/>
  <!-- red scarf slash -->
  <path fill="#ff3355" d="M70 372l372-96 10 40-372 96z"/>
  <path fill="#ffffff" opacity="0.85" d="M70 372l372-96 3 10-372 96z"/>
  <!-- star glint -->
