  <rect x="160" y="225" width="110" height="32" rx="8" fill="#22303B"/>
  <rect x="330" y="225" width="110" height="32" rx="8" fill="#22303B"/>
  <!-- dash -->
  <path d="M0 520 H600 V600 H0Z" fill="#22303B"/>
  <circle cx="300" cy="600" r="70" fill="none" stroke="#11181F" stroke-width="18"/>
