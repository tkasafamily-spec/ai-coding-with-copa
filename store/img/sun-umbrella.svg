  <circle cx="110" cy="110" r="55" fill="#FFB547"/>
  <g stroke="#FFB547" stroke-width="8" stroke-linecap="round">
    <path d="M110 30 v-15 M110 205 v-15 M30 110 h-15 M205 110 h-15 M53 53 l-11 -11 M178 178 l-11 -11 M53 167 l-11 11 M178 42 l-11 11"/>
  </g>
  <!-- car body from inside: windscreen frame -->
  <path d="M60 520 L120 250 Q130 215 170 215 H430 Q470 215 480 250 L540 520Z" fill="#33424F"/>
  <path d="M95 490 L145 270 Q152 245 180 245 H420 Q448 245 455 270 L505 490Z" fill="#9FD3E8"/>
