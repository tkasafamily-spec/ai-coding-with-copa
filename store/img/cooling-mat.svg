  <path d="M440 378 q10 8 20 0" stroke="#3B2614" stroke-width="5" fill="none" stroke-linecap="round"/>
  <ellipse cx="478" cy="398" rx="14" ry="10" fill="#3B2614"/>
  <ellipse cx="200" cy="440" rx="40" ry="16" fill="#C98B50"/>
  <ellipse cx="390" cy="444" rx="40" ry="16" fill="#C98B50"/>
  <path d="M152 392 Q100 380 110 340" stroke="#C98B50" stroke-width="22" fill="none" stroke-linecap="round"/>
  <text x="300" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#1C7F96">z z z</text>
</svg>
