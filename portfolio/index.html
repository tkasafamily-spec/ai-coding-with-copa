<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oreok's Thumbnails</title>
  <meta name="description" content="YouTube thumbnails made by Oreok.">
  <meta property="og:title" content="Oreok's Thumbnails">
  <meta property="og:description" content="YouTube thumbnails made by Oreok.">
  <meta property="og:image" content="thumbnails/duck-float.jpg">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'%3E%3Crect width='8' height='8' fill='%23000'/%3E%3Crect x='3' y='1' width='2' height='6' fill='%23FFC83D'/%3E%3Crect x='1' y='3' width='6' height='2' fill='%23FFC83D'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=6">
  <script>document.documentElement.classList.add("js");</script>
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>
  <div id="sparkles" aria-hidden="true"></div>

  <main>
    <header class="top">
      <h1>Oreok's work</h1>
      <a class="btn" href="#contact">Hire me</a>
    </header>

    <p class="hint">Tap a thumbnail to see it full screen.</p>
    <ul class="grid" id="grid"></ul>

    <section class="contact pop" id="contact" aria-labelledby="contact-title">
      <h2 id="contact-title">Want a thumbnail?</h2>
      <p>Email me your video idea and I’ll make one for it.</p>
      <div class="actions" id="contact-links">
        <a class="btn" href="mailto:oreoktkasa@gmail.com?subject=Thumbnail%20request">Email me</a>
        <!-- When you have a Discord username, swap this line for:
             <a class="btn btn-ghost" href="https://discord.com/users/YOUR-ID">Discord: yourname</a> -->
        <span class="btn btn-ghost btn-soon" aria-disabled="true">Discord coming soon</span>
      </div>
      <p class="email-line">oreoktkasa@gmail.com</p>
    </section>
  </main>

  <footer class="foot">
    <p>Every thumbnail here was made by Oreok.</p>
  </footer>

  <dialog class="viewer" id="viewer" aria-label="Thumbnail viewer">
    <img id="viewer-img" alt="">
    <div class="viewer-bar">
      <button type="button" class="vbtn" id="prev" aria-label="Previous thumbnail">‹</button>
      <button type="button" class="vbtn" id="next" aria-label="Next thumbnail">›</button>
      <span class="spacer"></span>
      <button type="button" class="vbtn" id="close" aria-label="Close">✕</button>
    </div>
  </dialog>

  <script src="thumbnails.js?v=6"></script>
  <script src="script.js?v=6"></script>
</body>
</html>
