<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Montserrat; font-weight: 900; src: url(node_modules/@fontsource/montserrat/files/montserrat-latin-900-normal.woff2) format("woff2"); }
@font-face { font-family: Montserrat; font-weight: 800; src: url(node_modules/@fontsource/montserrat/files/montserrat-latin-800-normal.woff2) format("woff2"); }
body { margin: 0; background: #000; }
</style>
<script type="importmap">{ "imports": { "three": "./node_modules/three/build/three.module.js" } }</script>
</head><body>
<script type="module">
import * as E from "./engine.js";
const id = new URLSearchParams(location.search).get("short");
window.init = async (data) => {
  await document.fonts.load('900 92px Montserrat');
  const mod = await import(`./shorts/${id}.js`);
  const world = E.makeWorld(mod.worldOpts || {});
  const short = mod.build(E, world, data);
  const out = document.createElement("canvas"); out.width = E.W; out.height = E.H;
  const ctx = out.getContext("2d");
  window.frame = (t, q = 0.92) => {
    short.update(t);
    world.renderer.render(world.scene, world.camera);
    ctx.drawImage(world.renderer.domElement, 0, 0);
    if (short.overlay) short.overlay(ctx, t);
    if (data.hook) E.drawHook(ctx, t, data.hook, data.timings[0].start + data.timings[0].len - 0.05);
    E.drawCaptions(ctx, t, data.captions);
    return out.toDataURL("image/jpeg", q);
  };
  return { duration: short.duration, sfx: short.sfx };
};
window.ready = true;
</script>
</body></html>
